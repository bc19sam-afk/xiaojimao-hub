name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      # 构建期不需要后台巡检 worker；关掉它避免与 build 期 openDb 并发访问 SQLite 致 "database is locked"
      WORKER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: docker pull node:26-bookworm
      - run: npm run test:restore-real
