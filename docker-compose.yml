# ============================================================================
# 小鸡毛账号收集系统 · 单机部署
#
# 🔴 单实例红线：绝不 replicas>1、绝不多容器共享 ./data 卷。
#    SQLite 单写模型——多个写入者会腐坏库。多实例需 PostgreSQL + 独立锁 worker，
#    本轮不做。扩容前先读 docs/deploy.md。
# ============================================================================
# 默认项目名：解决中文目录无法推导合法 Compose project name。
# 同宿主多环境须用 `-p` / COMPOSE_PROJECT_NAME 显式设不同名称，见 docs/deploy.md。
name: xiaojimao-hub

services:
  app:
    build: .
    restart: unless-stopped

    # 只绑本机回环：TLS 由前置反代（nginx/Caddy）终结，反代再转发到 127.0.0.1:3000。
    # 详见 docs/deploy.md 的 HTTPS 章节。
    ports:
      - "127.0.0.1:3000:3000"

    environment:
      # 🔴 关键：结算按服务器本地日折算，容器默认 UTC 会把结算日切错
      #    （CI 那个 UTC 00:00–00:10 grace 窗 flaky 的生产版）。tzdata 已装在镜像里。
      # ${TZ:-Asia/Shanghai}：compose 启动时从 shell 环境或项目目录 .env（即 env_file 那份）
      #   插值 TZ，未设则默认 Asia/Shanghai。用插值而非硬编码，是因为 environment 优先级高于
      #   env_file——硬编码会悄悄盖掉用户在 .env 里设的 TZ，让「改 .env 换时区」失效。
      TZ: ${TZ:-Asia/Shanghai}

    # 密钥/开关从 .env 读（SESSION_SECRET / MOCK / CPA_* / ADMIN_* 等）。
    # .env 含真实密钥，绝不进镜像/Git（见 .dockerignore、.gitignore）。
    # 首次部署：[ -f .env ] || install -m 600 .env.example .env（防重跑覆盖密钥）。
    env_file:
      - .env

    # 持久卷：库 + 备份落宿主 ./data，不进镜像/Git。
    # host 侧 ./data 需 uid 1000 可写（Linux：sudo chown -R 1000:1000 data），见 docs/deploy.md。
    volumes:
      - ./data:/app/data

    # 日志轮转：防 json-file 驱动把磁盘撑爆。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
